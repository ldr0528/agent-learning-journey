<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc"><title id="title">课程路线 · 从一次调用到可核验的研究助手</title><desc id="desc">11 章正文、两条贯穿案例，按信息流与依赖循序展开。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="680" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">课程路线 · 从一次调用到可核验的研究助手</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">11 章正文、两条贯穿案例，按信息流与依赖循序展开。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="204" font-size="17" fill="#3867D6" font-weight="600" text-anchor="start">01—04</text><text x="64" y="244" font-size="22" fill="#20293A" font-weight="600" text-anchor="start">模型、工具与循环</text><text x="64" y="306" font-size="19" fill="#20293A" font-weight="400" text-anchor="start">01  模型调用与消息</text><path d="M64 320L298 320" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="353" font-size="19" fill="#20293A" font-weight="400" text-anchor="start">02  工具执行与回传</text><path d="M64 367L298 367" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="400" font-size="19" fill="#20293A" font-weight="400" text-anchor="start">03  Agent Loop</text><path d="M64 414L298 414" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="447" font-size="19" fill="#20293A" font-weight="400" text-anchor="start">04  检索、引用与边界</text><path d="M64 461L298 461" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><path d="M308 237L355 237" fill="none" stroke="#3867D6" stroke-width="1.6" mar