<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">从检索结果到可追溯的回答</title>
<desc id="desc">模型给出查询词，程序读取三条本地摘要并按标签检索，将资料和编号返回模型。模型给出 Finish 后，程序校验引用并从记录读取来源链接。</desc>
<defs>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#798596" stroke-width="1.3"/>
</marker>
<marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#3867D6" stroke-width="1.3"/>
</marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#27816C" stroke-width="1.3"/>
</marker>
<marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#B36535" stroke-width="1.3"/>
</marker>
</defs>
<rect width="1280" height="740" fill="white"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<text x="48" y="34" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start" >AGENT LEARNING JOURNEY   /   FIG 4–1</text>
<text x="48" y="79" font-size="30" fill="#20293A" font-weight="600" text-anchor="start" >从检索结果到可追溯的回答</text>
<text x="48" y="112" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start" >模型负责提出查询与组织答案，程序保留并检查来源。</text>
<path d="M48 138H1232" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<rect x="80" y="242" width="256" height="222" rx="3" fill="#FAFBFD" stroke="#D9DFE8" stroke-width="1.5" />
<rect x="72" y="250" width="256" height="222" rx="3" fill="#FCFDFE" stroke="#D9DFE8" stroke-width="1.5" />
<rect x="64" y="258" width="256" height="222" rx="7" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" />
<text x="88" y="292" font-size="23" fill="#20293A" font-weight="600" text-anchor="start" >本地教学摘要</text>
<text x="88" y="320" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">notes.json</text>
<path d="M88 338H296" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="88" y="370" font-size="17" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">N01</text>
<text x="145" y="370" font-size="19" fill="#20293A" font-weight="400" text-anchor="start" >循环过程</text>
<text x="88" y="408" font-size="17" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">N02</text>
<text x="145" y="408" font-size="19" fill="#20293A" font-weight="400" text-anchor="start" >行动与反馈</text>
<text x="88" y="446" font-size="17" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">N03</text>
<text x="145" y="446" font-size="19" fill="#20293A" font-weight="400" text-anchor="start" >停止与预算</text>
<rect x="440" y="298" width="246" height="112" rx="7" fill="#F3FAF7" stroke="#BBDACF" stroke-width="1.5" />
<text x="563" y="344" font-size="26" fill="#27816C" font-weight="600" text-anchor="middle" >标签检索</text>
<text x="563" y="379" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >匹配 → 排序 → 返回</text>
<rect x="890" y="298" width="326" height="112" rx="7" fill="#F5F8FF" stroke="#B5C9F4" stroke-width="1.5" />
<text x="1053" y="344" font-size="26" fill="#3867D6" font-weight="600" text-anchor="middle" >模型组织答案</text>
<text x="1053" y="379" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >依据本次 Observation</text>
<path d="M320 354H432" fill="none" stroke="#798596" stroke-width="1.7"  marker-end="url(#arrow-gray)"/>
<text x="376" y="334" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >读取</text>
<path d="M1053 298V225Q1053 213 1041 213H575Q563 213 563 225V290" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<text x="808" y="196" font-size="20" fill="#3867D6" font-weight="400" text-anchor="middle" >① 模型提出查询词</text>
<path d="M686 354H882" fill="none" stroke="#27816C" stroke-width="1.7"  marker-end="url(#arrow-green)"/>
<text x="784" y="334" font-size="17" fill="#27816C" font-weight="400" text-anchor="middle" >② 资料 + 编号</text>
<path d="M1053 410V494" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<text x="1073" y="455" font-size="16" fill="#3867D6" font-weight="400" text-anchor="start" >③ Finish[解释…[N03]]</text>
<rect x="890" y="502" width="326" height="82" rx="7" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" />
<text x="1053" y="536" font-size="22" fill="#20293A" font-weight="600" text-anchor="middle" >检查引用编号</text>
<text x="1053" y="566" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >只接受本次返回的来源</text>
<path d="M192 480V529Q192 543 206 543H882" fill="none" stroke="#798596" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/>
<text x="540" y="526" font-size="19" fill="#6B7585" font-weight="400" text-anchor="middle" >来源链接从实际记录读取</text>
<path d="M64 632H1216" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="64" y="663" font-size="18" fill="#20293A" font-weight="600" text-anchor="start" >三项判断</text>
<text x="226" y="663" font-size="20" fill="#27816C" font-weight="400" text-anchor="start" >命中记录</text>
<text x="414" y="663" font-size="22" fill="#6B7585" font-weight="400" text-anchor="start" >≠</text>
<text x="494" y="663" font-size="20" fill="#3867D6" font-weight="400" text-anchor="start" >编号可追溯</text>
<text x="722" y="663" font-size="22" fill="#6B7585" font-weight="400" text-anchor="start" >≠</text>
<text x="804" y="663" font-size="20" fill="#20293A" font-weight="400" text-anchor="start" >结论得到资料支持</text>
<text x="64" y="709" font-size="19" fill="#6B7585" font-weight="400" text-anchor="start" >资料不足时如实说明；编号校验不能替代对内容的核对。</text>
</g>
</svg>
