<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700" role="img" aria-labelledby="title desc">
<title id="title">从资料到答案：依据是怎样留下来的</title>
<desc id="desc">三条本地摘要经过关键词检索，作为 Observation 交给模型，回答后由程序检查来源编号；这不能证明资料在语义上支持全部结论。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
<path d="M0 0L7 4L0 8" fill="none" stroke="#5e7c80" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1360" height="700" rx="24" fill="#f5f7f5"/>
<path d="M24 0H1336Q1360 0 1360 24V128H0V24Q0 0 24 0Z" fill="#142e37"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="62" font-size="35" fill="#ffffff" font-weight="700">从资料到答案：依据是怎样留下来的</text>
<text x="48" y="101" font-size="21" fill="#c4d9d9" font-weight="400">检索工具提供记录，模型组织回答，程序校验引用范围。</text>
<rect x="48" y="184" width="286" height="222" rx="16" fill="#fff" stroke="#d5e1de" stroke-width="1.5"/>
<text x="70" y="228" font-size="27" fill="#183c43" font-weight="700">本地资料</text>
<text x="70" y="278" font-size="20" fill="#425c62" font-weight="400">N01 · 循环过程</text>
<text x="70" y="319" font-size="20" fill="#425c62" font-weight="400">N02 · 行动与反馈</text>
<text x="70" y="360" font-size="20" fill="#425c62" font-weight="400">N03 · Finish 与预算</text>
<rect x="374" y="184" width="286" height="222" rx="16" fill="#eaf4ef" stroke="#d5e1de" stroke-width="1.5"/>
<text x="396" y="228" font-size="27" fill="#183c43" font-weight="700">Python 检索</text>
<text x="396" y="278" font-size="20" fill="#425c62" font-weight="400">输入：模型给的查询词</text>
<text x="396" y="319" font-size="20" fill="#425c62" font-weight="400">按标签匹配与排序</text>
<text x="396" y="360" font-size="20" fill="#425c62" font-weight="400">输出：记录及来源</text>
<rect x="700" y="184" width="286" height="222" rx="16" fill="#edf3fb" stroke="#d5e1de" stroke-width="1.5"/>
<text x="722" y="228" font-size="27" fill="#183c43" font-weight="700">模型形成回答</text>
<text x="722" y="278" font-size="20" fill="#425c62" font-weight="400">接收 Observation</text>
<text x="722" y="319" font-size="20" fill="#425c62" font-weight="400">解释资料中的结论</text>
<text x="722" y="360" font-size="20" fill="#425c62" font-weight="400">在 Finish 内写 [N03]</text>
<rect x="1026" y="184" width="286" height="222" rx="16" fill="#eaf4ef" stroke="#d5e1de" stroke-width="1.5"/>
<text x="1048" y="228" font-size="27" fill="#183c43" font-weight="700">程序检查</text>
<text x="1048" y="278" font-size="20" fill="#425c62" font-weight="400">先检索，再尝试结束</text>
<text x="1048" y="319" font-size="20" fill="#425c62" font-weight="400">编号必须本次已返回</text>
<text x="1048" y="360" font-size="20" fill="#425c62" font-weight="400">从记录中取来源链接</text>
<path d="M343 296H362" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M669 296H688" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M995 296H1014" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="48" y="436" width="1264" height="64" rx="16" fill="#fff1e5" stroke="none" stroke-width="1.5"/>
<text x="72" y="476" font-size="23" fill="#81522d" font-weight="700">资料不足：可以说明缺少依据并结束；不能据此断言教材没有相关知识。</text>
<text x="48" y="545" font-size="23" fill="#183c43" font-weight="700">三项判断，逐层核对</text>
<rect x="48" y="566" width="396" height="70" rx="16" fill="#fff" stroke="#d5e1de" stroke-width="1.5"/>
<text x="70" y="596" font-size="22" fill="#183c43" font-weight="700">检索命中</text>
<text x="70" y="624" font-size="20" fill="#425c62" font-weight="400">标签匹配到了记录</text>
<rect x="462" y="566" width="396" height="70" rx="16" fill="#fff" stroke="#d5e1de" stroke-width="1.5"/>
<text x="484" y="596" font-size="22" fill="#183c43" font-weight="700">编号可追溯</text>
<text x="484" y="624" font-size="20" fill="#425c62" font-weight="400">引用来自本次返回的记录</text>
<rect x="876" y="566" width="436" height="70" rx="16" fill="#edf3fb" stroke="#d5e1de" stroke-width="1.5"/>
<text x="898" y="596" font-size="22" fill="#244b6b" font-weight="700">结论得到支持</text>
<text x="898" y="624" font-size="20" fill="#425c62" font-weight="400">仍需核对资料与结论的含义</text>
<text x="48" y="674" font-size="20" fill="#425c62" font-weight="400">当前实现：三条教学摘要、关键词检索与编号检查；没有自动完成语义事实核验。</text>
</g>
</svg>
