<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">一次请求里，模型实际接收了什么？</title>
<desc id="desc">消息列表中的 system 和 user 经请求传给模型服务，回复从响应中提取；配置单独由程序提供。</desc>
<defs>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#798596" stroke-width="1.3"/>
</marker>
<marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#3867D6" stroke-width="1.3"/>
</marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#27816C" stroke-width="1.3"/>
</marker>
<marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#B36535" stroke-width="1.3"/>
</marker>
</defs>
<rect width="1280" height="620" fill="white"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<text x="48" y="34" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start" >AGENT LEARNING JOURNEY   /   FIG 1–1</text>
<text x="48" y="79" font-size="30" fill="#20293A" font-weight="600" text-anchor="start" >一次请求里，模型实际接收了什么？</text>
<text x="48" y="112" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start" >输入由 messages 明确提供，输出从响应对象中提取。</text>
<path d="M48 138H1232" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="64" y="206" font-size="20" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">messages</text>
<text x="1180" y="206" font-size="20" fill="#6B7585" font-weight="400" text-anchor="end" font-family="Consolas, Microsoft YaHei, monospace">response</text>
<rect x="64" y="230" width="326" height="170" rx="7" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" />
<path d="M64 315H390" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="84" y="260" font-size="15" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">system</text>
<text x="84" y="293" font-size="21" fill="#20293A" font-weight="400" text-anchor="start" >简洁中文，给一个短例子</text>
<text x="84" y="345" font-size="15" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">user</text>
<text x="84" y="378" font-size="21" fill="#20293A" font-weight="400" text-anchor="start" >Python 字典是什么？</text>
<path d="M390 314H506" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<text x="448" y="295" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >提交</text>
<rect x="514" y="260" width="238" height="108" rx="7" fill="#F5F8FF" stroke="#B5C9F4" stroke-width="1.5" />
<text x="633" y="306" font-size="27" fill="#3867D6" font-weight="600" text-anchor="middle" >模型服务</text>
<text x="633" y="340" font-size="19" fill="#6B7585" font-weight="400" text-anchor="middle" >处理本次请求</text>
<path d="M752 314H874" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<text x="814" y="295" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >返回</text>
<rect x="882" y="230" width="298" height="170" rx="7" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" />
<text x="904" y="264" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">choices[0].message</text>
<path d="M904 281H1158" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="904" y="314" font-size="16" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">content</text>
<text x="904" y="350" font-size="23" fill="#20293A" font-weight="400" text-anchor="start" >模型生成的回答文本</text>
<text x="904" y="381" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start" >提取后再打印或继续处理</text>
<path d="M633 455V379" fill="none" stroke="#798596" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/>
<text x="633" y="482" font-size="20" fill="#6B7585" font-weight="400" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace">model · options</text>
<text x="633" y="510" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >服务地址与密钥由程序配置</text>
<path d="M64 555H1180" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="64" y="588" font-size="17" fill="#3867D6" font-weight="600" text-anchor="start" >输入边界</text>
<text x="172" y="588" font-size="20" fill="#20293A" font-weight="400" text-anchor="start" >终端输出、本地文件和变量，不会自动进入这次请求。</text>
</g>
</svg>
