<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">框架与协议 · 两种不同职责</title><desc id="desc">LangGraph 表达执行流程；MCP 让工具能力通过标准会话被调用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="820" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">框架与协议 · 两种不同职责</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">LangGraph 表达执行流程；MCP 让工具能力通过标准会话被调用。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="198" font-size="18" fill="#3867D6" font-weight="600" text-anchor="start">LANGGRAPH  /  用图组织状态与节点</text><rect x="64" y="228" width="290" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="262" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">understand</text><text x="82" y="293" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">准备查询词</text><rect x="464" y="228" width="290" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="482" y="262" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">search</text><text x="482" y="293" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">读取本地资料</text><rect x="864" y="228" width="352" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="882" y="262" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">answer</text><text x="882" y="293" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">根据返回证据作答</text><path d="M354 273L456 273" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M754 273L856 273" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="64" y="365" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">State 在节点间传递；检查点示例保存进程内快照。天气循环另用条件边决定继续或结束。</text><path d="M64 407L1216 407" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="458" font-size="18" fill="#3867D6" font-weight="600" text-anchor="start">MCP  /  客户端与工具服务端的实际通信</text><rect x="64" y="501" width="290" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="535" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">MCP 客户端</text><text x="82" y="566" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">会话与请求</text><rect x="464" y="501" width="290" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="482" y="535" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">stdio 通道</text><text x="482" y="566" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">跨进程传输</text><rect x="864" y="501" width="352" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="882" y="535" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">MCP 服务端</text><text x="882" y="566" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">注册工具并执行本地函数</text><path d="M354 545L456 545" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M754 545L856 545" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1040 591V666H209V599" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="471" y="653" font-size="18" fill="#27816C" font-weight="400" text-anchor="start">工具结果返回客户端</text><text x="64" y="725" font-size="22" fill="#20293A" font-weight="600" text-anchor="start">initialize  →  list_tools  →  call_tool</text><text x="64" y="770" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">协议负责发现与调用；工具负责具体工作；模型是否参与决策由应用决定。</text></g></svg>
