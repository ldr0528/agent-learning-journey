<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc"><title id="title">医疗险比较 · 从需求到有出处的报告</title><desc id="desc">每个比较单元都保留产品、资料版本、适用条件和证据编号。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="730" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">医疗险比较 · 从需求到有出处的报告</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">每个比较单元都保留产品、资料版本、适用条件和证据编号。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><rect x="64" y="210" width="248" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="244" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">投保关注点</text><text x="82" y="275" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">需求 · 产品 · 资料版本</text><rect x="366" y="210" width="248" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="384" y="244" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">模型选择取证</text><text x="384" y="275" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">查询 / 读取指定维度</text><rect x="668" y="210" width="248" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="686" y="244" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">程序执行工具</text><text x="686" y="275" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">限定产品、版本与证据</text><rect x="970" y="210" width="246" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="988" y="244" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">版本化资料</text><text x="988" y="275" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">事实 · 条件 · 条款定位</text><path d="M312 255L358 255" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M614 255L660 255" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M916 255L962 255" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1093 300V350H490V306" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="675" y="337" font-size="18" fill="#27816C" font-weight="400" text-anchor="start">工具结果进入下一轮模型请求</text><path d="M366 280H338V475H358" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="64" y="383" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">缺需求 → 先补充</text><text x="64" y="451" font-size="18" fill="#3867D6" font-weight="400" text-anchor="start">材料齐全 → 提交</text><rect x="366" y="430" width="248" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="384" y="464" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">提交比较依据</text><text x="384" y="495" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">只提交已读取的证据 ID</text><rect x="668" y="430" width="248" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="686" y="464" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">覆盖与来源校验</text><text x="686" y="495" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">完整性 · 归属 · 适用条件</text><rect x="970" y="430" width="246" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="988" y="464" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">生成比较报告</text><text x="988" y="495" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">事实对照 · 缺口 · 下一步</text><path d="M614 475L660 475" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M916 475L962 475" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="366" y="562" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">校验有缺项 → 将错误回传模型，在剩余预算内补查。</text><path d="M64 603L1216 603" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="646" font-size="19" fill="#27816C" font-weight="600" text-anchor="start">会话与预算</text><text x="235" y="646" font-size="19" fill="#20293A" font-weight="400" text-anchor="start">保存需求和结果；补充后重新取证。达到调用上限，保留部分证据并说明未完成。</text><text x="64" y="687" font-size="19" fill="#6B7585" font-weight="400" text-anchor="start">Python、LangGraph 与 MCP 共用同一资料契约；表格内容由程序从条款事实生成。</text></g></svg>
