<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220" role="img" aria-labelledby="title desc"><title id="title">MCP 工具回传 · 模型与程序各做什么</title><desc id="desc">应用将模型的工具请求转换为 MCP 调用，再把结果送回下一轮消息。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="1220" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">MCP 工具回传 · 模型与程序各做什么</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">应用将模型的工具请求转换为 MCP 调用，再把结果送回下一轮消息。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><rect x="64" y="190" width="292" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="224" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">模型</text><text x="82" y="255" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">原生 tool_calls / 最终文本</text><rect x="494" y="190" width="292" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="512" y="224" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">Python 应用</text><text x="512" y="255" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">模型 API + MCP 客户端</text><rect x="924" y="190" width="292" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="942" y="224" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">MCP 服务端</text><text x="942" y="255" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">子进程中的本地工具</text><path d="M210 280L210 1020" fill="none" stroke="#D9DFE8" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M640 280L640 1020" fill="none" stroke="#D9DFE8" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M1070 280L1070 1020" fill="none" stroke="#D9DFE8" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M640 330L1070 330" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="855.0" y="315" font-size="18" fill="#27816C" font-weight="400" text-anchor="middle">initialize / list_tools</text><path d="M1070 390L640 390" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="855.0" y="375" font-size="18" fill="#27816C" font-weight="400" text-anchor="middle">返回工具名与参数 schema</text><path d="M640 475L210 475" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="425.0" y="460" font-size="18" fill="#3867D6" font-weight="400" text-anchor="middle">请求 1：问题 + 工具定义</text><path d="M210 535L640 535" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="425.0" y="520" font-size="18" fill="#3867D6" font-weight="400" text-anchor="middle">tool_calls：weather（北京）</text><path d="M640 595L1070 595" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="855.0" y="580" font-size="18" fill="#27816C" font-weight="400" text-anchor="middle">call_tool：weather（北京）</text><path d="M1070 655L640 655" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="855.0" y="640" font-size="18" fill="#27816C" font-weight="400" text-anchor="middle">返回模拟天气：12℃</text><path d="M640 740L210 740" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="425.0" y="725" font-size="18" fill="#3867D6" font-weight="400" text-anchor="middle">请求 2：加入 role=tool 结果</text><rect x="64" y="790" width="1152" height="66" rx="7" fill="#F3FAF7" stroke="#D9DFE8"/><text x="640" y="830" font-size="21" fill="#27816C" font-weight="400" text-anchor="middle">模型再请求上海 → MCP 实际执行 → 返回模拟天气 22℃</text><path d="M640 915L210 915" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="425" y="900" font-size="18" fill="#3867D6" font-weight="400" text-anchor="middle">请求 3：携带两地工具结果</text><path d="M210 985L640 985" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="425" y="970" font-size="18" fill="#3867D6" font-weight="400" text-anchor="middle">最终文本：上海更暖和</text><path d="M64 1050L1216 1050" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="1096" font-size="23" fill="#20293A" font-weight="600" text-anchor="start">3 次模型请求，2 次 MCP 工具调用。</text><text x="64" y="1137" font-size="19" fill="#6B7585" font-weight="400" text-anchor="start">tool_call_id 将结果关联到对应的工具请求；MCP 会话负责另一层通信。</text><text x="64" y="1174" font-size="19" fill="#6B7585" font-weight="400" text-anchor="start">模型无需直接连接 MCP 服务端；Python 应用负责发现、映射、执行与回传。</text></g></svg>
