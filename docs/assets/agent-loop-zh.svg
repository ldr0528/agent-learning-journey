<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img" aria-labelledby="title desc">
<title id="title">Research Agent 的信息流</title>
<desc id="desc">模型读取消息输出 Action，程序解析后执行本地检索。Observation 返回消息供下一轮决策。有效 Finish 输出答案与来源，所有模型调用受请求预算约束。</desc>
<defs>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#798596" stroke-width="1.3"/>
</marker>
<marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#3867D6" stroke-width="1.3"/>
</marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#27816C" stroke-width="1.3"/>
</marker>
<marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#B36535" stroke-width="1.3"/>
</marker>
</defs>
<rect width="1280" height="770" fill="white"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<text x="48" y="34" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start" >AGENT LEARNING JOURNEY   /   ARCHITECTURE</text>
<text x="48" y="79" font-size="30" fill="#20293A" font-weight="600" text-anchor="start" >Research Agent 的信息流</text>
<text x="48" y="112" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start" >同一个循环连接模型、工具、消息历史与来源校验。</text>
<path d="M48 138H1232" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<rect x="48" y="220" width="936" height="450" rx="8" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="64" y="207" width="158" height="26" rx="0" fill="white" stroke="none" stroke-width="1.5" />
<text x="72" y="227" font-size="16" fill="#6B7585" font-weight="600" text-anchor="start" >一次任务的状态</text>
<text x="944" y="253" font-size="16" fill="#6B7585" font-weight="400" text-anchor="end" font-family="Consolas, Microsoft YaHei, monospace">请求上限：max_steps</text>
<rect x="76" y="298" width="236" height="160" rx="7" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" />
<text x="96" y="330" font-size="21" fill="#3867D6" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">messages</text>
<path d="M96 347H292" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="96" y="379" font-size="19" fill="#20293A" font-weight="400" text-anchor="start" >system + 用户问题</text>
<text x="96" y="414" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">Action / Observation</text>
<text x="96" y="443" font-size="16" fill="#6B7585" font-weight="400" text-anchor="start" >每轮继续累积</text>
<rect x="414" y="319" width="220" height="106" rx="7" fill="#F5F8FF" stroke="#B5C9F4" stroke-width="1.5" />
<text x="524" y="364" font-size="25" fill="#3867D6" font-weight="600" text-anchor="middle" >模型决策</text>
<text x="524" y="397" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >查询或尝试 Finish</text>
<rect x="734" y="319" width="218" height="106" rx="7" fill="#F3FAF7" stroke="#BBDACF" stroke-width="1.5" />
<text x="843" y="364" font-size="25" fill="#27816C" font-weight="600" text-anchor="middle" >程序控制</text>
<text x="843" y="397" font-size="18" fill="#6B7585" font-weight="400" text-anchor="middle" >解析 · 执行 · 校验</text>
<path d="M312 372H406" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<text x="358" y="352" font-size="17" fill="#6B7585" font-weight="400" text-anchor="middle" >发送</text>
<path d="M634 372H726" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<text x="682" y="352" font-size="16" fill="#3867D6" font-weight="400" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace">Action</text>
<rect x="734" y="524" width="218" height="100" rx="7" fill="#F3FAF7" stroke="#BBDACF" stroke-width="1.5" />
<text x="843" y="563" font-size="24" fill="#27816C" font-weight="600" text-anchor="middle" >本地检索</text>
<text x="843" y="596" font-size="17" fill="#6B7585" font-weight="400" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace">search_notes</text>
<path d="M843 425V516" fill="none" stroke="#27816C" stroke-width="1.7"  marker-end="url(#arrow-green)"/>
<text x="862" y="475" font-size="17" fill="#27816C" font-weight="400" text-anchor="start" >工具请求</text>
<path d="M734 574H206Q194 574 194 562V466" fill="none" stroke="#27816C" stroke-width="1.7"  marker-end="url(#arrow-green)"/>
<text x="470" y="555" font-size="20" fill="#27816C" font-weight="400" text-anchor="middle" >Observation 追加到消息</text>
<path d="M952 372H1054" fill="none" stroke="#27816C" stroke-width="1.7"  marker-end="url(#arrow-green)"/>
<text x="1006" y="352" font-size="14" fill="#27816C" font-weight="400" text-anchor="middle" >有效 Finish</text>
<rect x="1062" y="319" width="170" height="106" rx="7" fill="#FFFFFF" stroke="#D9DFE8" stroke-width="1.5" />
<text x="1147" y="357" font-size="22" fill="#20293A" font-weight="600" text-anchor="middle" >答案 + 来源</text>
<text x="1147" y="388" font-size="16" fill="#6B7585" font-weight="400" text-anchor="middle" >引用编号与链接</text>
<text x="1062" y="473" font-size="17" fill="#27816C" font-weight="600" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">finished</text>
<text x="1062" y="505" font-size="16" fill="#6B7585" font-weight="400" text-anchor="start" >流程接受了答复</text>
<path d="M64 706H1216" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="64" y="738" font-size="17" fill="#B36535" font-weight="600" text-anchor="start" >边界</text>
<text x="126" y="738" font-size="19" fill="#6B7585" font-weight="400" text-anchor="start" >格式与引用错误会回传给模型；修正仍占用请求预算。预算耗尽时报告未完成。</text>
</g>
</svg>
