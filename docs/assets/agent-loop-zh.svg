<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">研究助手：从问题到带来源的回答</title>
  <desc id="desc">用户问题进入模型上下文。模型提出 Action，程序解析后执行本地检索，再把 Observation 加入消息供模型继续决策。有效 Finish 经过引用校验后输出答案与来源；请求次数由程序限制。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#44766d" stroke-width="1.8"/></marker>
    <marker id="darkArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#334155" stroke-width="1.8"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 25px; font-weight: 700; fill: #152e37; }
      .body { font-size: 17px; fill: #42565e; }
      .small { font-size: 15px; fill: #53696d; }
      .mono { font-family: Consolas, monospace; font-size: 16px; fill: #1e6558; }
    </style>
  </defs>
  <rect width="1440" height="800" rx="24" fill="#f6f7f2"/>
  <rect x="56" y="48" width="8" height="29" rx="4" fill="#17806d"/>
  <text x="80" y="69" class="label" fill="#177563">AGENT LEARNING JOURNEY / RESEARCH AGENT</text>
  <text x="56" y="121" font-size="38" font-weight="700" fill="#142f38">从问题到带来源的回答</text>
  <text x="56" y="154" class="body">模型提出行动 · 程序执行工具 · 结果进入下一次请求</text>

  <path d="M 1246 220 V 192 H 535 V 220" fill="none" stroke="#44766d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="710" y="175" width="490" height="32" rx="16" fill="#e5f0e9"/>
  <text x="955" y="197" text-anchor="middle" class="small" fill="#226457">程序把工具结果作为 Observation 加入 messages</text>

  <rect x="56" y="230" width="260" height="164" rx="18" fill="#fff" stroke="#d8dfd8"/>
  <text x="80" y="265" class="label" fill="#8c784b">01 / INPUT</text>
  <text x="80" y="306" class="heading">用户问题</text>
  <text x="80" y="340" class="body">Agent Loop 为什么</text>
  <text x="80" y="367" class="body">要有最大步数？</text>

  <rect x="400" y="230" width="270" height="164" rx="18" fill="#e8f3ec" stroke="#a6cbbc"/>
  <text x="424" y="265" class="label" fill="#177563">02 / MODEL</text>
  <text x="424" y="306" class="heading">模型决策</text>
  <text x="424" y="340" class="body">读取问题与已有观察</text>
  <text x="424" y="367" class="body">选择查询，或给出 Finish</text>

  <rect x="754" y="230" width="270" height="164" rx="18" fill="#173b45"/>
  <text x="778" y="265" class="label" fill="#9dd6c8">03 / RUNTIME</text>
  <text x="778" y="306" font-size="25" font-weight="700" fill="#fff">程序解析与控制</text>
  <text x="778" y="340" font-size="17" fill="#d9e8e7">检查格式、参数和预算</text>
  <text x="778" y="367" font-size="17" fill="#d9e8e7">执行工具，或校验答案</text>

  <rect x="1108" y="230" width="276" height="164" rx="18" fill="#fff" stroke="#d8dfd8"/>
  <text x="1132" y="265" class="label" fill="#8c784b">04 / TOOL</text>
  <text x="1132" y="306" class="heading">本地资料检索</text>
  <text x="1132" y="340" class="mono">search_notes(query)</text>
  <text x="1132" y="367" class="body">返回摘要、编号与出处</text>

  <path d="M 316 312 H 390" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#darkArrow)"/>
  <text x="357" y="296" text-anchor="middle" class="small">消息</text>
  <path d="M 670 312 H 744" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#darkArrow)"/>
  <text x="712" y="296" text-anchor="middle" class="small">Action</text>
  <path d="M 1024 312 H 1098" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#darkArrow)"/>
  <text x="1066" y="296" text-anchor="middle" class="small">调用</text>

  <rect x="56" y="480" width="614" height="200" rx="18" fill="#eef0e9"/>
  <text x="84" y="519" class="label" fill="#536b64">程序负责的边界</text>
  <circle cx="91" cy="554" r="4" fill="#17806d"/>
  <text x="109" y="560" class="body">最大步数限制模型请求次数，防止持续循环。</text>
  <circle cx="91" cy="594" r="4" fill="#17806d"/>
  <text x="109" y="600" class="body">格式或引用错误回传给模型，修正也占用预算。</text>
  <circle cx="91" cy="634" r="4" fill="#17806d"/>
  <text x="109" y="640" class="body">资料不足时如实说明；预算耗尽则报告未完成。</text>

  <path d="M 889 394 V 470" fill="none" stroke="#44766d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="910" y="443" class="small">Finish 分支</text>
  <rect x="754" y="480" width="630" height="200" rx="18" fill="#fff" stroke="#a6cbbc"/>
  <text x="782" y="519" class="label" fill="#177563">OUTPUT / 校验通过后结束</text>
  <text x="782" y="559" class="heading">最终回答 + 引用来源</text>
  <text x="782" y="597" class="body">回答内标注 [N03]，程序列出真实记录中的章节与链接。</text>
  <text x="782" y="638" class="small">编号有效不等于结论正确，仍需核对资料是否支持回答。</text>

  <line x1="56" y1="722" x2="1384" y2="722" stroke="#d8dfd8"/>
  <text x="56" y="758" class="small">提示词文字协议 · 本地教学摘要 · 原创中文架构图</text>
  <text x="1384" y="758" text-anchor="end" class="small">实现依据：Hello-Agents 工具循环 / 本项目代码</text>
</svg>
