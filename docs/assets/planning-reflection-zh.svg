<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970" role="img" aria-labelledby="title desc"><title id="title">两种任务组织方式 · 计划执行与评审修订</title><desc id="desc">流程中的每次模型请求都计入预算；中间产物由程序保存并回传。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="970" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">两种任务组织方式 · 计划执行与评审修订</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">流程中的每次模型请求都计入预算；中间产物由程序保存并回传。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="196" font-size="18" fill="#3867D6" font-weight="600" text-anchor="start">PLAN-AND-SOLVE  /  先制定计划，再依次执行</text><rect x="64" y="232" width="246" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="266" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">原始问题</text><text x="82" y="297" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">目标与已知条件</text><rect x="366" y="232" width="246" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="384" y="266" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">规划器</text><text x="384" y="297" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">一次请求生成步骤列表</text><rect x="668" y="232" width="246" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="686" y="266" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">执行当前步骤</text><text x="686" y="297" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">计划 + 历史结果 + 本步</text><rect x="970" y="232" width="246" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="988" y="266" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">记录结果</text><text x="988" y="297" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">供后续步骤使用</text><path d="M310 277L359 277" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M612 277L661 277" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M914 277L963 277" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1093 322V384H791V328" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="818" y="372" font-size="17" fill="#27816C" font-weight="400" text-anchor="start">还有步骤且预算足够</text><text x="64" y="409" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">全部步骤完成 → 返回最终结果；预算耗尽 → 保留已完成部分并说明未完成。</text><path d="M64 456L1216 456" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="506" font-size="18" fill="#3867D6" font-weight="600" text-anchor="start">REFLECTION  /  依据反馈，有限次地修订</text><rect x="64" y="608" width="278" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="642" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">初始回答</text><text x="82" y="673" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">围绕原问题生成草稿</text><rect x="501" y="608" width="278" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="519" y="642" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">评审</text><text x="519" y="673" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">给出通过或修改建议</text><rect x="938" y="608" width="278" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="956" y="642" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">修订</text><text x="956" y="673" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">使用草稿与评审反馈</text><path d="M342 651L493 651" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M779 651L930 651" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="797" y="617" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">需修改</text><text x="797" y="640" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">预算足够</text><path d="M1077 608V555H640V600" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="719" y="544" font-size="17" fill="#27816C" font-weight="400" text-anchor="start">修订后再次评审</text><path d="M640 698L640 766" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="660" y="741" font-size="17" fill="#27816C" font-weight="400" text-anchor="start">通过</text><rect x="501" y="778" width="278" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="519" y="812" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">结束</text><text x="519" y="843" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">标明是否通过评审</text><text x="64" y="920" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">达到预算上限 → 保留草稿并标未通过；评审通过仍需外部事实或测试核验。</text></g></svg>
