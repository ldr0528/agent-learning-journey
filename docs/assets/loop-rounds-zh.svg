<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700" role="img" aria-labelledby="title desc">
<title id="title">一次任务，三轮决策</title>
<desc id="desc">第一轮查北京，第二轮查上海，第三轮输出 Finish；请求上限为二时，在第三次请求前停止，报告未完成。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
<path d="M0 0L7 4L0 8" fill="none" stroke="#5e7c80" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1360" height="700" rx="24" fill="#f5f7f5"/>
<path d="M24 0H1336Q1360 0 1360 24V128H0V24Q0 0 24 0Z" fill="#142e37"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="62" font-size="35" fill="#ffffff" font-weight="700">一次任务，三轮决策</text>
<text x="48" y="101" font-size="21" fill="#c4d9d9" font-weight="400">依据已经运行过的北京、上海天气比较轨迹绘制。</text>
<rect x="48" y="184" width="384" height="348" rx="16" fill="#fff" stroke="#d5e1de" stroke-width="1.5"/>
<text x="72" y="223" font-size="27" fill="#183c43" font-weight="700">第 1 轮</text>
<rect x="68" y="245" width="344" height="112" rx="10" fill="#edf3fb" stroke="none" stroke-width="1.5"/>
<text x="84" y="275" font-size="20" fill="#244b6b" font-weight="700">模型请求</text>
<text x="84" y="308" font-size="21" fill="#425c62" font-weight="400">尚无工具结果</text>
<text x="84" y="339" font-size="17" fill="#244b6b" font-weight="400">Action: get_weather(city=&quot;北京&quot;)</text>
<path d="M240 361V380" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="68" y="392" width="344" height="116" rx="10" fill="#eaf4ef" stroke="none" stroke-width="1.5"/>
<text x="84" y="423" font-size="20" fill="#276357" font-weight="700">执行工具 ①</text>
<text x="84" y="458" font-size="25" fill="#276357" font-weight="700">下雨，12℃</text>
<text x="84" y="490" font-size="19" fill="#425c62" font-weight="400">追加北京的 Observation</text>
<rect x="488" y="184" width="384" height="348" rx="16" fill="#fff" stroke="#d5e1de" stroke-width="1.5"/>
<text x="512" y="223" font-size="27" fill="#183c43" font-weight="700">第 2 轮</text>
<rect x="508" y="245" width="344" height="112" rx="10" fill="#edf3fb" stroke="none" stroke-width="1.5"/>
<text x="524" y="275" font-size="20" fill="#244b6b" font-weight="700">模型请求</text>
<text x="524" y="308" font-size="21" fill="#425c62" font-weight="400">已有北京结果</text>
<text x="524" y="339" font-size="17" fill="#244b6b" font-weight="400">Action: get_weather(city=&quot;上海&quot;)</text>
<path d="M680 361V380" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="508" y="392" width="344" height="116" rx="10" fill="#eaf4ef" stroke="none" stroke-width="1.5"/>
<text x="524" y="423" font-size="20" fill="#276357" font-weight="700">执行工具 ②</text>
<text x="524" y="458" font-size="25" fill="#276357" font-weight="700">晴天，22℃</text>
<text x="524" y="490" font-size="19" fill="#425c62" font-weight="400">追加上海的 Observation</text>
<rect x="928" y="184" width="384" height="348" rx="16" fill="#fff" stroke="#d5e1de" stroke-width="1.5"/>
<text x="952" y="223" font-size="27" fill="#183c43" font-weight="700">第 3 轮</text>
<rect x="948" y="245" width="344" height="112" rx="10" fill="#edf3fb" stroke="none" stroke-width="1.5"/>
<text x="964" y="275" font-size="20" fill="#244b6b" font-weight="700">模型请求</text>
<text x="964" y="308" font-size="21" fill="#425c62" font-weight="400">已有北京与上海结果</text>
<text x="964" y="339" font-size="17" fill="#244b6b" font-weight="400">Action: Finish[上海更暖和…]</text>
<path d="M1120 361V380" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="948" y="392" width="344" height="116" rx="10" fill="#eaf4ef" stroke="none" stroke-width="1.5"/>
<text x="964" y="423" font-size="20" fill="#276357" font-weight="700">接受最终答复</text>
<text x="964" y="458" font-size="25" fill="#276357" font-weight="700">结束，不调用工具</text>
<text x="964" y="490" font-size="19" fill="#425c62" font-weight="400">保留答案与计数</text>
<path d="M442 320H476" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M882 320H916" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M900 166V548" fill="none" stroke="#ba7546" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="48" y="566" width="824" height="66" rx="16" fill="#fff1e5" stroke="none" stroke-width="1.5"/>
<text x="72" y="607" font-size="23" fill="#81522d" font-weight="700">上限为 2：到此停止，数据齐了，但还没有最终答复。</text>
<rect x="928" y="566" width="384" height="66" rx="16" fill="#eaf4ef" stroke="none" stroke-width="1.5"/>
<text x="952" y="607" font-size="21" fill="#276357" font-weight="700">模型请求 3 次 · 工具执行 2 次</text>
<text x="48" y="673" font-size="21" fill="#425c62" font-weight="400">消息会累积：第三次请求包含两座城市的结果。图中天气为教学模拟数据。</text>
</g>
</svg>
