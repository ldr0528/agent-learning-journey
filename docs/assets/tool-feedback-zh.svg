<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" aria-labelledby="title desc">
<title id="title">工具结果怎样回到模型</title>
<desc id="desc">第一次请求返回 Action；Python 执行模拟天气工具，将 Action 与 Observation 追加到 messages；第二次请求获得天气结果。打印不等于发送。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
<path d="M0 0L7 4L0 8" fill="none" stroke="#5e7c80" stroke-width="1.5"/>
</marker>
</defs>
<rect width="1360" height="800" rx="24" fill="#f5f7f5"/>
<path d="M24 0H1336Q1360 0 1360 24V128H0V24Q0 0 24 0Z" fill="#142e37"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="62" font-size="35" fill="#ffffff" font-weight="700">工具结果怎样回到模型</text>
<text x="48" y="101" font-size="21" fill="#c4d9d9" font-weight="400">两次模型请求之间，程序负责执行函数和组织反馈。</text>
<rect x="48" y="176" width="704" height="94" rx="16" fill="#edf3fb" stroke="#d5e1de" stroke-width="1.5"/>
<text x="72" y="214" font-size="25" fill="#244b6b" font-weight="700">① 第一次模型请求</text>
<text x="72" y="249" font-size="22" fill="#425c62" font-weight="400">返回 Action: get_weather(city=&quot;上海&quot;)</text>
<path d="M400 278V302" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="48" y="316" width="704" height="94" rx="16" fill="#eaf4ef" stroke="#d5e1de" stroke-width="1.5"/>
<text x="72" y="354" font-size="25" fill="#276357" font-weight="700">② Python 解析并执行工具</text>
<text x="72" y="389" font-size="22" fill="#425c62" font-weight="400">get_weather → 晴天，22℃（模拟数据）</text>
<path d="M400 418V442" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="48" y="456" width="704" height="94" rx="16" fill="#eaf4ef" stroke="#d5e1de" stroke-width="1.5"/>
<text x="72" y="494" font-size="25" fill="#276357" font-weight="700">③ 程序扩充 messages</text>
<text x="72" y="529" font-size="22" fill="#425c62" font-weight="400">保存 Action，再追加 Observation</text>
<path d="M400 558V582" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="48" y="596" width="704" height="94" rx="16" fill="#edf3fb" stroke="#d5e1de" stroke-width="1.5"/>
<text x="72" y="634" font-size="25" fill="#244b6b" font-weight="700">④ 第二次模型请求</text>
<text x="72" y="669" font-size="22" fill="#425c62" font-weight="400">提交扩充后的消息，模型依据结果组织回答</text>
<rect x="800" y="176" width="512" height="422" rx="16" fill="#fff" stroke="#d5e1de" stroke-width="1.5"/>
<text x="824" y="218" font-size="26" fill="#183c43" font-weight="700">第二次请求的 messages</text>
<rect x="824" y="246" width="464" height="66" rx="9" fill="#f1f4f3" stroke="none" stroke-width="1.5"/>
<text x="842" y="273" font-size="19" fill="#596c70" font-weight="700">system</text>
<text x="842" y="301" font-size="21" fill="#425c62" font-weight="400">工具说明与回答规则</text>
<rect x="824" y="326" width="464" height="66" rx="9" fill="#f1f4f3" stroke="none" stroke-width="1.5"/>
<text x="842" y="353" font-size="19" fill="#596c70" font-weight="700">user</text>
<text x="842" y="381" font-size="21" fill="#425c62" font-weight="400">上海天气怎么样？</text>
<rect x="824" y="406" width="464" height="70" rx="9" fill="#eaf4ef" stroke="none" stroke-width="1.5"/>
<text x="842" y="433" font-size="19" fill="#276357" font-weight="700">assistant · 新增</text>
<text x="842" y="461" font-size="21" fill="#425c62" font-weight="400">Action: get_weather(...)</text>
<rect x="824" y="490" width="464" height="80" rx="9" fill="#eaf4ef" stroke="none" stroke-width="1.5"/>
<text x="842" y="517" font-size="19" fill="#276357" font-weight="700">user · 程序新增</text>
<text x="842" y="545" font-size="21" fill="#425c62" font-weight="400">Observation: 晴天，22℃</text>
<path d="M760 503H792" fill="none" stroke="#5e7c80" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="800" y="620" width="512" height="70" rx="16" fill="#fff1e5" stroke="none" stroke-width="1.5"/>
<text x="824" y="650" font-size="21" fill="#81522d" font-weight="700">print(result) 只显示在终端</text>
<text x="824" y="679" font-size="20" fill="#81522d" font-weight="400">它不会改变模型的下一次输入。</text>
<text x="48" y="742" font-size="20" fill="#425c62" font-weight="400">文字协议的教学实现：Observation 使用程序构造的 user 消息承载。</text>
<text x="48" y="775" font-size="20" fill="#425c62" font-weight="400">模型提出操作 → 程序执行 → 结果进入消息 → 模型继续回答。</text>
</g>
</svg>
