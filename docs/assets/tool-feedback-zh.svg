<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="838" viewBox="0 0 1280 838" role="img" aria-labelledby="title desc">
<title id="title">一次工具回传的时序</title>
<desc id="desc">程序向模型发起请求，模型返回 Action。程序调用天气函数获得模拟天气，将 Action 和 Observation 加入消息后再次请求模型。</desc>
<defs>
<marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#798596" stroke-width="1.3"/>
</marker>
<marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#3867D6" stroke-width="1.3"/>
</marker>
<marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#27816C" stroke-width="1.3"/>
</marker>
<marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L6 3.5L0 7" fill="none" stroke="#B36535" stroke-width="1.3"/>
</marker>
</defs>
<rect width="1280" height="838" fill="white"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<text x="48" y="34" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start" >AGENT LEARNING JOURNEY   /   FIG 2–1</text>
<text x="48" y="79" font-size="30" fill="#20293A" font-weight="600" text-anchor="start" >一次工具回传的时序</text>
<text x="48" y="112" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start" >模型提出请求，程序执行工具，再把结果送进下一次模型调用。</text>
<path d="M48 138H1232" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<rect x="105" y="172" width="230" height="70" rx="5" fill="#F3FAF7" stroke="#27816C" stroke-width="1.5" />
<text x="220" y="202" font-size="23" fill="#27816C" font-weight="600" text-anchor="middle" >Python 程序</text>
<text x="220" y="228" font-size="16" fill="#6B7585" font-weight="400" text-anchor="middle" >请求 · 执行 · 保存消息</text>
<path d="M220 242V742" fill="none" stroke="#D9DFE8" stroke-width="1.5" stroke-dasharray="5 7"/>
<rect x="535" y="172" width="230" height="70" rx="5" fill="#F5F8FF" stroke="#3867D6" stroke-width="1.5" />
<text x="650" y="202" font-size="23" fill="#3867D6" font-weight="600" text-anchor="middle" >模型</text>
<text x="650" y="228" font-size="16" fill="#6B7585" font-weight="400" text-anchor="middle" >决定行动 · 组织回答</text>
<path d="M650 242V742" fill="none" stroke="#D9DFE8" stroke-width="1.5" stroke-dasharray="5 7"/>
<rect x="975" y="172" width="230" height="70" rx="5" fill="#F3FAF7" stroke="#27816C" stroke-width="1.5" />
<text x="1090" y="202" font-size="23" fill="#27816C" font-weight="600" text-anchor="middle" >天气工具</text>
<text x="1090" y="228" font-size="16" fill="#6B7585" font-weight="400" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace">get_weather(city)</text>
<path d="M1090 242V510" fill="none" stroke="#D9DFE8" stroke-width="1.5" stroke-dasharray="5 7"/>
<path d="M220 286H642" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<circle cx="244" cy="267" r="12" fill="white" stroke="#3867D6" stroke-width="1.5"/>
<text x="244" y="272" font-size="14" fill="#3867D6" font-weight="600" text-anchor="middle" >1</text>
<text x="435" y="269" font-size="20" fill="#20293A" font-weight="400" text-anchor="middle" >提交 system + user</text>
<path d="M650 354H228" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<circle cx="626" cy="335" r="12" fill="white" stroke="#3867D6" stroke-width="1.5"/>
<text x="626" y="340" font-size="14" fill="#3867D6" font-weight="600" text-anchor="middle" >2</text>
<text x="435" y="337" font-size="19" fill="#3867D6" font-weight="400" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace">Action: get_weather(...)</text>
<rect x="214" y="367" width="12" height="151" rx="1" fill="#E7F4ED" stroke="#27816C" stroke-width="1.5" />
<path d="M226 420H1082" fill="none" stroke="#27816C" stroke-width="1.7"  marker-end="url(#arrow-green)"/>
<circle cx="250" cy="401" r="12" fill="white" stroke="#3867D6" stroke-width="1.5"/>
<text x="250" y="406" font-size="14" fill="#3867D6" font-weight="600" text-anchor="middle" >3</text>
<text x="658" y="403" font-size="21" fill="#20293A" font-weight="400" text-anchor="middle" >执行 get_weather(&quot;上海&quot;)</text>
<path d="M1090 490H228" fill="none" stroke="#27816C" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow-green)"/>
<circle cx="1066" cy="471" r="12" fill="white" stroke="#3867D6" stroke-width="1.5"/>
<text x="1066" y="476" font-size="14" fill="#3867D6" font-weight="600" text-anchor="middle" >4</text>
<text x="658" y="473" font-size="21" fill="#27816C" font-weight="400" text-anchor="middle" >返回：晴天，22℃</text>
<rect x="82" y="535" width="400" height="76" rx="5" fill="#F3FAF7" stroke="#BBDACF" stroke-width="1.5" />
<circle cx="108" cy="560" r="12" fill="white" stroke="#27816C" stroke-width="1.5"/>
<text x="108" y="565" font-size="14" fill="#27816C" font-weight="600" text-anchor="middle" >5</text>
<text x="136" y="564" font-size="20" fill="#27816C" font-weight="600" text-anchor="start" >追加 Action 与 Observation</text>
<text x="136" y="594" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">messages.append(...)</text>
<path d="M220 650H642" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<circle cx="244" cy="631" r="12" fill="white" stroke="#3867D6" stroke-width="1.5"/>
<text x="244" y="636" font-size="14" fill="#3867D6" font-weight="600" text-anchor="middle" >6</text>
<text x="435" y="633" font-size="19" fill="#20293A" font-weight="400" text-anchor="middle" >携带更新后的 messages</text>
<path d="M650 718H228" fill="none" stroke="#3867D6" stroke-width="1.7"  marker-end="url(#arrow-blue)"/>
<circle cx="626" cy="699" r="12" fill="white" stroke="#3867D6" stroke-width="1.5"/>
<text x="626" y="704" font-size="14" fill="#3867D6" font-weight="600" text-anchor="middle" >7</text>
<text x="435" y="701" font-size="20" fill="#20293A" font-weight="400" text-anchor="middle" >根据观察结果生成回答</text>
<path d="M826 563H1204" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="826" y="594" font-size="20" fill="#20293A" font-weight="600" text-anchor="start" >显示与回传的区别</text>
<text x="826" y="629" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">print(result)</text>
<text x="1014" y="629" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start" >只写到终端</text>
<text x="826" y="663" font-size="17" fill="#27816C" font-weight="400" text-anchor="start" font-family="Consolas, Microsoft YaHei, monospace">messages.append</text>
<text x="1014" y="663" font-size="18" fill="#27816C" font-weight="400" text-anchor="start" >更新后续输入</text>
<path d="M48 777H1232" fill="none" stroke="#D9DFE8" stroke-width="1.5" />
<text x="48" y="807" font-size="17" fill="#6B7585" font-weight="600" text-anchor="start" >时间自上而下</text>
<text x="210" y="807" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start" >本例的 Observation 由程序构造，以 user 消息回传；天气为模拟数据。</text>
</g>
</svg>
