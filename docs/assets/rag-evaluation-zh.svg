<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">RAG 与评估 · 从资料到可追溯回答</title><desc id="desc">先构造证据，再生成回答；用固定问题分别检查检索与生成。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="820" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">RAG 与评估 · 从资料到可追溯回答</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">先构造证据，再生成回答；用固定问题分别检查检索与生成。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="198" font-size="18" fill="#27816C" font-weight="600" text-anchor="start">离线准备</text><rect x="64" y="228" width="290" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="262" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">资料与出处</text><text x="82" y="293" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">教学语料 · 来源链接</text><rect x="464" y="228" width="290" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="482" y="262" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">切分与编号</text><text x="482" y="293" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">段落 / 片段 / 可追溯标识</text><rect x="864" y="228" width="352" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="882" y="262" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">检索索引</text><text x="882" y="293" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">本课程基线：词法相关性</text><path d="M354 273L456 273" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M754 273L856 273" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="64" y="385" font-size="18" fill="#3867D6" font-weight="600" text-anchor="start">处理问题</text><rect x="64" y="414" width="246" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="448" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">用户问题</text><text x="82" y="479" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">明确研究目标</text><rect x="366" y="414" width="246" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="384" y="448" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">检索</text><text x="384" y="479" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">返回排名与来源片段</text><rect x="668" y="414" width="246" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="686" y="448" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">组织证据</text><text x="686" y="479" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">选中内容与引用编号</text><rect x="970" y="414" width="246" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="988" y="448" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">回答与报告</text><text x="988" y="479" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">依据证据 · 标注来源</text><path d="M310 459L358 459" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M612 459L660 459" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M914 459L962 459" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1040 318V354H489V406" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M64 565L1216 565" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="607" font-size="18" fill="#6B7585" font-weight="600" text-anchor="start">分别评估</text><rect x="64" y="632" width="352" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="666" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">检索质量</text><text x="82" y="697" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">相关资料是否命中、排在哪里</text><rect x="464" y="632" width="352" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="482" y="666" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">引用与覆盖</text><text x="482" y="697" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">引用能否追溯、主张是否标注</text><rect x="864" y="632" width="352" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="882" y="666" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">答案质量</text><text x="882" y="697" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">人工核对事实与证据支持</text><text x="64" y="770" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">检索分数、引用合法和答案正确是不同判断；没有证据时要明确说明。</text></g></svg>
