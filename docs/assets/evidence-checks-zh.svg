<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">从检索命中到结论可信 · 四个检查点</title><desc id="desc">排序、上下文、引用编号和语义支持，需要分别判断。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="820" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">从检索命中到结论可信 · 四个检查点</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">排序、上下文、引用编号和语义支持，需要分别判断。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><rect x="64" y="208" width="264" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="242" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">01  检索命中</text><text x="82" y="273" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">词语相关，能找到候选</text><rect x="360" y="208" width="264" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="378" y="242" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">02  纳入上下文</text><text x="378" y="273" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">预算内选入模型请求</text><rect x="656" y="208" width="264" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="674" y="242" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">03  引用合法</text><text x="674" y="273" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">编号来自本轮证据</text><rect x="952" y="208" width="264" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="970" y="242" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">04  语义支持</text><text x="970" y="273" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">结论没有越过证据</text><path d="M328 253L352 253" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M624 253L648 253" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M920 253L944 253" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="64" y="356" font-size="21" fill="#20293A" font-weight="400" text-anchor="start">前三项可做程序检查；最后一项还需要逐条读证据、看限定条件。</text><path d="M64 395L1216 395" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="447" font-size="20" fill="#3867D6" font-weight="600" text-anchor="start">真实样本  /  RAG 为什么要保留来源与引用？</text><rect x="64" y="478" width="545" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="512" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">D08-C01 · 资料中的要求</text><text x="82" y="543" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">只引用实际纳入上下文的资料；仍需核对语义。</text><rect x="671" y="478" width="545" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="689" y="512" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">模型回答 · 需要审慎理解的词</text><text x="689" y="543" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">“确保”生成的回答仅基于上下文证据。</text><path d="M609 523L663 523" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><text x="64" y="621" font-size="25" fill="#B36535" font-weight="600" text-anchor="start">引用编号存在 ≠ 已证明“确保”。</text><text x="64" y="665" font-size="20" fill="#20293A" font-weight="400" text-anchor="start">这一句可表达设计目标，但保留来源本身不能保证模型绝不引入外部信息。</text><text x="64" y="705" font-size="19" fill="#6B7585" font-weight="400" text-anchor="start">阅读顺序：找到编号 → 对照原句 → 检查因果与强弱 → 给出判读。</text><text x="64" y="774" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">依据本仓库 2026-11-19 的真实 qwen-plus 样本绘制；保留原回答，不代替模型改写。</text></g></svg>
