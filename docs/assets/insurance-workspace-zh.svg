<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-labelledby="title desc"><title id="title">医疗险咨询工作区 · 一次咨询如何持续进行</title><desc id="desc">界面、执行状态与产品证据分别管理，让每一步都有明确的输入、结果和恢复边界。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 4L0 8" fill="none" stroke="#798596" stroke-width="1.4"/></marker></defs><rect width="1280" height="825" fill="white"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="48" y="35" font-size="12" fill="#6B7585" font-weight="600" text-anchor="start">AGENT LEARNING JOURNEY  /  ORIGINAL DIAGRAM</text><text x="48" y="80" font-size="30" fill="#20293A" font-weight="600" text-anchor="start">医疗险咨询工作区 · 一次咨询如何持续进行</text><text x="48" y="113" font-size="18" fill="#6B7585" font-weight="400" text-anchor="start">界面、执行状态与产品证据分别管理，让每一步都有明确的输入、结果和恢复边界。</text><path d="M48 140L1232 140" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><text x="64" y="190" font-size="17" fill="#6B7585" font-weight="600" text-anchor="start">咨询界面</text><rect x="64" y="214" width="320" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="248" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">对话与需求草稿</text><text x="82" y="279" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">本轮原话 → 可编辑字段</text><rect x="480" y="214" width="320" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="498" y="248" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">用户确认范围</text><text x="498" y="279" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">关注点 · 2–3 份产品资料</text><rect x="896" y="214" width="320" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="914" y="248" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">报告与来源抽屉</text><text x="914" y="279" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">关注项摘要 · 九维对照</text><path d="M384 259L472 259" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M640 304L640 385" fill="none" stroke="#3867D6" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1056 385L1056 312" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="64" y="366" font-size="17" fill="#6B7585" font-weight="600" text-anchor="start">业务执行</text><rect x="64" y="390" width="320" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="424" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">需求提取 / 报告追问</text><text x="82" y="455" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">模型选字段或证据，程序核验</text><rect x="480" y="390" width="320" height="90" rx="7" fill="#F5F8FF" stroke="#D9DFE8" stroke-width="1.5"/><text x="498" y="424" font-size="23" fill="#3867D6" font-weight="600" text-anchor="start">后台取证任务</text><text x="498" y="455" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">按版本读资料 → 完成校验</text><rect x="896" y="390" width="320" height="90" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="914" y="424" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">有依据的报告</text><text x="914" y="455" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">事实 + 条件 + 未知项</text><path d="M800 435L888 435" fill="none" stroke="#27816C" stroke-width="1.6" marker-end="url(#arrow)"/><text x="480" y="517" font-size="18" fill="#3867D6" font-weight="400" text-anchor="start">任务事件 → 页面增量读取进度</text><text x="896" y="517" font-size="18" fill="#27816C" font-weight="400" text-anchor="start">追问仅引用当前报告</text><path d="M64 553L1216 553" fill="none" stroke="#D9DFE8" stroke-width="1.6"/><rect x="64" y="595" width="538" height="100" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="82" y="629" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">SQLite · 会话与执行状态</text><text x="82" y="660" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">消息 / 草稿 / 需求版本 / 报告历史 / 任务事件</text><rect x="678" y="595" width="538" height="100" rx="7" fill="#F3FAF7" stroke="#D9DFE8" stroke-width="1.5"/><text x="696" y="629" font-size="23" fill="#27816C" font-weight="600" text-anchor="start">版本化目录 · 可核查事实</text><text x="696" y="660" font-size="17" fill="#6B7585" font-weight="400" text-anchor="start">已选产品范围 / 九维覆盖 / 来源编号 / 适用条件</text><text x="64" y="743" font-size="17" fill="#3867D6" font-weight="600" text-anchor="start">运行控制</text><text x="185" y="743" font-size="20" fill="#20293A" font-weight="400" text-anchor="start">同一会话互斥 · 提交幂等 · 协作式停止 · 中断不自动重放模型请求</text><text x="64" y="785" font-size="19" fill="#6B7585" font-weight="400" text-anchor="start">需求更新后，旧报告标记为对应上次需求；确认新范围后重新取证。</text></g></svg>
