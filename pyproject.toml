[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-learning-journey"
version = "0.3.0"
description = "A Chinese agent learning handbook with inspectable workflows, retrieval, evaluation, LangGraph and MCP examples."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai==2.54.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
graph = ["langgraph==1.2.23"]
mcp = ["mcp==1.30.0"]
all = ["langgraph==1.2.23", "mcp==1.30.0"]

[project.scripts]
agent-research = "agent_learning.cli:main"
insurance-agent = "agent_learning.insurance.cli:main"
insurance-workbench = "agent_learning.insurance.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*.txt"]

[tool.setuptools.package-data]
agent_learning = ["data/*.json", "insurance/static/*.html"]
